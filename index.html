<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список задач</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-gradient"></div>

  <main class="app">
    <header>
      <h1>Мои задачи</h1>
      <p id="current-date" class="date"></p>
    </header>

    <form id="todo-form" class="todo-form">
      <input id="todo-input" type="text" placeholder="Что нужно сделать?" autocomplete="off" maxlength="200">

      <div class="date-picker-wrapper" id="date-picker-wrapper">
        <button type="button" class="date-btn" id="date-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          <span id="date-btn-text">Когда?</span>
        </button>

        <div class="custom-calendar hidden" id="custom-calendar">
          <div class="cal-header">
            <button type="button" class="cal-nav" id="prev-month">←</button>
            <span id="cal-month-year"></span>
            <button type="button" class="cal-nav" id="next-month">→</button>
          </div>

          <div class="cal-weekdays">
            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
          </div>

          <div class="cal-days" id="cal-days"></div>

          <div class="cal-time">
            <span>Время:</span>
            <div class="time-selects">
              <select id="cal-hours" class="time-select"></select>
              <span>:</span>
              <select id="cal-minutes" class="time-select"></select>
            </div>
          </div>

          <div class="cal-actions">
            <button type="button" class="cal-apply" id="cal-apply">Выбрать</button>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn" title="Добавить">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </form>

    <div class="controls">
      <p id="counter" class="counter">0 из 0 выполнено</p>

      <!-- Кнопки массового удаления -->
      <div class="bulk-actions" id="bulk-actions">
        <button id="clear-done" class="bulk-btn" title="Удалить выполненные">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          Выполненные
        </button>
        <button id="clear-all" class="bulk-btn danger" title="Удалить все">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          Все
        </button>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="active">В процессе</button>
        <button class="filter-btn" data-filter="done">Готово</button>
      </div>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <div id="empty" class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a0aec0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      <p>Задач пока нет</p>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список задач</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-gradient"></div>

  <main class="app">
    <header>
      <h1>Мои задачи</h1>
      <p id="current-date" class="date"></p>
    </header>

    <form id="todo-form" class="todo-form">
      <input id="todo-input" type="text" placeholder="Что нужно сделать?" autocomplete="off" maxlength="200">
      <input id="todo-date" type="datetime-local" class="date-input" title="Установить дату и время">
      <button type="submit" title="Добавить">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </form>

    <div class="controls">
      <p id="counter" class="counter">0 из 0 выполнено</p>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="active">В процессе</button>
        <button class="filter-btn" data-filter="done">Готово</button>
      </div>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <div id="empty" class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a0aec0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      <p>Задач пока нет</p>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="script.js"></script>
</body>
</html>
